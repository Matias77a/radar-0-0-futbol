name: Actualizar radar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Consultar API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          key = os.environ["API_FOOTBALL_KEY"]

          url = "https://v3.football.api-sports.io/fixtures?live=all"

          request = urllib.request.Request(
              url,
              headers={
                  "x-apisports-key": key,
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          matches = data.get("response", [])

          output = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "matches": matches
          }

          with open("data/live.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False)

          print("Partidos recibidos:", len(matches))
          PY

      - name: Guardar actualización
        run: |
          git config user.name "radar-0-0-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/live.json

          git diff --cached --quiet || git commit -m "Actualizar partidos en vivo"

          git push
