name: Actualizar radar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Consultar API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          key = os.environ["API_FOOTBALL_KEY"]

          url = "https://v3.football.api-sports.io/fixtures?live=all"

          request = urllib.request.Request(
              url,
              headers={
                  "x-apisports-key": key,
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          matches = data.get("response", [])

          # Principales ligas europeas
          european_leagues = {
              39,   # Premier League
              140,  # La Liga
              135,  # Serie A
              78,   # Bundesliga
              61,   # Ligue 1
              88,   # Eredivisie
              94,   # Primeira Liga
              144,  # Bélgica
              203,  # Turquía
              197,  # Grecia
              218,  # Austria
              207,  # Suiza
          }

          # Principales ligas sudamericanas
          south_american_leagues = {
              128,  # Argentina
              71,   # Brasil
              268,  # Uruguay
              239,  # Colombia
              265,  # Chile
              250,  # Paraguay
              242,  # Ecuador
              281,  # Perú
              200,  # Bolivia
              299,  # Venezuela
          }

          # Copas continentales
          continental_cups = {
              2,    # Champions League
              3,    # Europa League
              848,  # Conference League
              13,   # Copa Libertadores
              11,   # Copa Sudamericana
              550,  # Recopa Sudamericana
          }

          allowed_leagues = (
              european_leagues
              | south_american_leagues
              | continental_cups
          )

          radar_matches = []

          for match in matches:
              league = match.get("league", {})
              league_id = league.get("id")

              fixture = match.get("fixture", {})
              status = fixture.get("status", {})
              status_short = status.get("short")

              score = match.get("score", {})
              fulltime = score.get("fulltime", {})

              home_goals = fulltime.get("home")
              away_goals = fulltime.get("away")

              # Solo:
              # 1. Competición incluida
              # 2. Segundo tiempo normal
              # 3. Marcador 0-0
              if (
                  league_id in allowed_leagues
                  and status_short == "2H"
                  and home_goals == 0
                  and away_goals == 0
              ):
                  radar_matches.append(match)

          output = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "matches": radar_matches
          }

          os.makedirs("data", exist_ok=True)

          with open("data/live.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("Partidos en vivo recibidos:", len(matches))
          print("Partidos 0-0 en segundo tiempo:", len(radar_matches))

          for match in radar_matches:
              fixture = match.get("fixture", {})
              teams = match.get("teams", {})
              league = match.get("league", {})

              home = teams.get("home", {}).get("name", "Local")
              away = teams.get("away", {}).get("name", "Visitante")
              league_name = league.get("name", "Competición")
              elapsed = fixture.get("status", {}).get("elapsed", "?")

              print(
                  f"RADAR: {league_name} | "
                  f"{home} 0-0 {away} | "
                  f"Minuto {elapsed}"
              )

          PY

      - name: Guardar actualización
        run: |
          git config user.name "radar-0-0-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/live.json

          git diff --cached --quiet || git commit -m "Actualizar radar 0-0"

          git push
